[project]
name = "ai-agent"
version = "0.1.0"
description = "AI Agent and Vibe Coding playground"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ollama>=0.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
